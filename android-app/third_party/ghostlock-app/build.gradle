plugins {
    id 'com.android.application' version '9.3.1' apply false
}

// ONDK
def ondkHome() {
    def env = System.getenv('ONDK_HOME')
    if (env) {
        return env
    }
    def props = new Properties()
    def propsFile = rootProject.file('local.properties')
    if (propsFile.isFile()) {
        propsFile.withInputStream { props.load(it) }
    }
    return props.getProperty('ondk.dir')
}

def useOndk() {
    def home = ondkHome()
    return home != null && !home.isBlank()
}

def resolveNdkDir() {
    if (useOndk()) {
        return ondkHome()
    }
    def ndkEnv = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT')
    if (ndkEnv) {
        return ndkEnv
    }
    def props = new Properties()
    def propsFile = rootProject.file('local.properties')
    if (propsFile.isFile()) {
        propsFile.withInputStream { props.load(it) }
    }
    def ndkProp = props.getProperty('ndk.dir')
    if (ndkProp) {
        return ndkProp
    }
    def sdkDir = props.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME')
    if (sdkDir) {
        def ndkRoot = new File(sdkDir, 'ndk')
        def versions = ndkRoot.listFiles()?.findAll { it.isDirectory() }?.collect { it.name } ?: []
        if (versions) {
            versions.sort()
            return new File(ndkRoot, versions.last()).absolutePath
        }
    }
    throw new GradleException('NDK not found; set ANDROID_NDK_HOME or ndk.dir in local.properties')
}

def extractNdkTools() {
    def ndk = resolveNdkDir()
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    def prebuilt = isWindows ? 'windows-x86_64' : 'linux-x86_64'
    def binDir = new File(new File(ndk, 'toolchains/llvm/prebuilt'), prebuilt + '/bin')
    def clang = new File(binDir, isWindows ? 'aarch64-linux-android35-clang.cmd' : 'aarch64-linux-android35-clang').absolutePath
    def ar = new File(binDir, isWindows ? 'llvm-ar.exe' : 'llvm-ar').absolutePath
    return [clang: clang, ar: ar]
}

tasks.register('buildGhostlockNative', Exec) {
    workingDir rootDir
    commandLine 'make', 'ghostlock'
    environment 'ANDROID_NDK_HOME', resolveNdkDir()
    environment 'NDK_ROOT', resolveNdkDir()
    inputs.files(
        fileTree('src') { include '**/*.c', '**/*.h' },
        file('Makefile')
    )
    outputs.file(file('ghostlock'))
}

tasks.register('prepareGhostlockJniLibs', Copy) {
    dependsOn('buildGhostlockNative')
    from('ghostlock')
    into('app/src/main/jniLibs/arm64-v8a')
    rename { 'libghostlock.so' }
}

tasks.register('buildGhostlockExtract', Exec) {
    def tools = extractNdkTools()
    def isOndk = useOndk()
    workingDir rootProject.file('tools/extract_rs')
    def cmd = ['cargo']
    if (isOndk) cmd.add('+ondk')
    cmd.addAll(['build', '--release', '--target', 'aarch64-linux-android'])
    if (isOndk) {
        cmd.addAll(['-Z', 'build-std=std,panic_abort'])
        cmd.addAll(['-Z', 'build-std-features=optimize_for_size'])
    }
    commandLine cmd
    environment 'CC_aarch64_linux_android', tools.clang
    environment 'AR_aarch64_linux_android', tools.ar
    environment 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER', tools.clang
    if (isOndk) {
        environment 'RUSTC_BOOTSTRAP', '1'
    }
    inputs.files(
        fileTree('tools/extract_rs/src') { include '**/*.rs' },
        file('tools/extract_rs/Cargo.toml'),
        file('tools/extract_rs/Cargo.lock')
    )
    inputs.property('useOndk', isOndk)
    outputs.file(file('tools/extract_rs/target/aarch64-linux-android/release/ghostlock-extract'))
}

tasks.register('prepareGhostlockExtractJniLibs', Copy) {
    dependsOn('buildGhostlockExtract')
    from('tools/extract_rs/target/aarch64-linux-android/release/ghostlock-extract')
    into('app/src/main/jniLibs/arm64-v8a')
    rename { 'libextract.so' }
}
