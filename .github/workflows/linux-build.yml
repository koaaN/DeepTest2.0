name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name DeepTest2 \
            --add-data 'android-helper/assets/OP15:android-helper/assets/OP15' \
            --add-data 'android-helper/assets/ACE6T:android-helper/assets/ACE6T' \
            --add-data 'src/deeptesting/assets:deeptesting/assets' \
            --paths src launcher.py

      - name: Package artifact
        run: tar -czf DeepTest2-linux-x86_64.tar.gz -C dist DeepTest2

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepTest2-Linux
          path: DeepTest2-linux-x86_64.tar.gz
