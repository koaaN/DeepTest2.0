name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Download Android Platform Tools
        run: |
          curl -L https://dl.google.com/android/repository/platform-tools-latest-linux.zip -o platform-tools.zip
          unzip -q platform-tools.zip

      - name: Build executable
        run: pyinstaller --noconfirm --clean DeepTest2.spec

      - name: Package artifact
        run: tar -czf DeepTest2-linux-x86_64.tar.gz -C dist DeepTest2

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepTest2-Linux
          path: DeepTest2-linux-x86_64.tar.gz
