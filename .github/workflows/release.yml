name: Build Windows, Linux and macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag, for example V1.1.3"
        required: true
        default: "V1.1.3"
      previous_tag:
        description: "Previous published release used to generate the changelog"
        required: true
        default: "V1.1.2"
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: |
          curl -L https://dl.google.com/android/repository/platform-tools-latest-linux.zip -o platform-tools.zip
          unzip -q platform-tools.zip
          pyinstaller --noconfirm --clean DeepTest2.spec
          tar -czf DeepTest2-linux-x86_64.tar.gz -C dist DeepTest2
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: DeepTest2-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .
          New-Item -ItemType Directory -Force webview2-runtime | Out-Null
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2124701" -OutFile "webview2-runtime\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          pyinstaller --noconfirm --clean DeepTest2.spec
          Compress-Archive -Path dist\DeepTest2.exe -DestinationPath DeepTest2-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: DeepTest2-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: |
          curl -L https://dl.google.com/android/repository/platform-tools-latest-darwin.zip -o platform-tools.zip
          ditto -x -k platform-tools.zip .
          chmod +x platform-tools/adb
          pyinstaller --noconfirm --clean DeepTest2.spec
          ditto -c -k --sequesterRsrc --keepParent dist/DeepTest2.app DeepTest2-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: DeepTest2-macOS.zip

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-release"
          merge-multiple: true
      - name: Generate changelog from previous release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PREVIOUS_TAG_INPUT: ${{ inputs.previous_tag }}
        run: |
          previous_tag="$PREVIOUS_TAG_INPUT"
          if [ -z "$previous_tag" ]; then
            previous_tag="$(git tag --sort=-version:refname | grep -Fvx "$RELEASE_TAG" | head -n 1)"
          fi
          if [ -z "$previous_tag" ]; then
            echo "Could not determine the previous release tag." >&2
            exit 1
          fi
          echo "Generating release notes from $previous_tag to $RELEASE_TAG"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f previous_tag_name="$previous_tag" \
            --jq .body > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: DeepTest 2.0 ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
