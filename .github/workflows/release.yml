name: Build Windows, Linux and macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag, for example V1.1.3"
        required: true
        default: "V1.1.3"
      previous_tag:
        description: "Previous published release used to generate the changelog"
        required: true
        default: "V1.1.2"
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: |
          curl -L https://dl.google.com/android/repository/platform-tools-latest-linux.zip -o platform-tools.zip
          unzip -q platform-tools.zip
          pyinstaller --noconfirm --clean DeepTest2.spec
          tar -czf DeepTest2-linux-x86_64.tar.gz -C dist DeepTest2
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: DeepTest2-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .
          pyinstaller --noconfirm --clean DeepTest2.spec
          Compress-Archive -Path dist\DeepTest2 -DestinationPath DeepTest2-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: DeepTest2-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: |
          curl -L https://dl.google.com/android/repository/platform-tools-latest-darwin.zip -o platform-tools.zip
          ditto -x -k platform-tools.zip .
          chmod +x platform-tools/adb
          pyinstaller --noconfirm --clean DeepTest2.spec
          ditto -c -k --sequesterRsrc --keepParent dist/DeepTest2.app DeepTest2-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: DeepTest2-macOS.zip

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify prebuilt GhostLock helper
        working-directory: android-app
        run: sha256sum --check PREBUILT_GHOSTLOCK.sha256
      - name: Prepare Android release metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version_name="${RELEASE_TAG#v}"
          version_name="${version_name#V}"
          echo "DEEPTEST_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "DEEPTEST_ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Prepare Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Android release-signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deeptest-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/deeptest-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../DeepTest2-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: DeepTest2-android-arm64.apk
          if-no-files-found: error

  release:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-release"
          merge-multiple: true
      - name: Generate changelog from previous release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PREVIOUS_TAG_INPUT: ${{ inputs.previous_tag }}
        run: |
          previous_tag="$PREVIOUS_TAG_INPUT"
          if [ -z "$previous_tag" ]; then
            previous_tag="$(git tag --sort=-version:refname | grep -Fvx "$RELEASE_TAG" | head -n 1)"
          fi
          if [ -z "$previous_tag" ]; then
            echo "Could not determine the previous release tag." >&2
            exit 1
          fi
          echo "Generating release notes from $previous_tag to $RELEASE_TAG"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f previous_tag_name="$previous_tag" \
            --jq .body > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: DeepTest 2.0 ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
