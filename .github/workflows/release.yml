name: Build Windows and Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example V1.1.0"
        required: true
        default: "V1.1.0"
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev libgtk-3-0 pkg-config
      - run: |
          python -m pip install --upgrade pip
          pip install -e . "PyGObject<3.51" pyinstaller
      - run: |
          curl -L https://dl.google.com/android/repository/platform-tools-latest-linux.zip -o platform-tools.zip
          unzip -q platform-tools.zip
          pyinstaller --noconfirm --clean DeepTest2.spec
          tar -czf DeepTest2-linux-x86_64.tar.gz -C dist DeepTest2
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: DeepTest2-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .
          pyinstaller --noconfirm --clean DeepTest2.spec
          Compress-Archive -Path dist\DeepTest2 -DestinationPath DeepTest2-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: DeepTest2-windows.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-release"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: DeepTest 2.0 ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
