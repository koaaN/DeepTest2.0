name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        default: "v1.0.1"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: |
          pyinstaller --noconfirm --clean --windowed \
            --name DeepTest2 \
            --add-data 'android-helper/assets:android-helper/assets' \
            --add-data 'src/deeptesting/assets:deeptesting/assets' \
            --paths src launcher.py
          tar -czf DeepTest2-linux-x86_64.tar.gz -C dist DeepTest2
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: DeepTest2-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .
          pyinstaller --noconfirm --clean --windowed `
            --name DeepTest2 `
            --add-data "android-helper\assets;android-helper\assets" `
            --add-data "src\deeptesting\assets;deeptesting\assets" `
            --add-data "platform-tools;platform-tools" `
            --paths src launcher.py
          Compress-Archive -Path dist\DeepTest2 -DestinationPath DeepTest2-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: DeepTest2-windows.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13   # Intel
            arch: x86_64
          - runner: macos-14   # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: |
          pyinstaller --noconfirm --clean --windowed \
            --name DeepTest2 \
            --add-data 'android-helper/assets:android-helper/assets' \
            --add-data 'src/deeptesting/assets:deeptesting/assets' \
            --paths src launcher.py
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/DeepTest2.app" "DeepTest2-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          path: DeepTest2-macos-${{ matrix.arch }}.zip

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-release"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: DeepTest 2.0 ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
