name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Download Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .

      - name: Build executable
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name DeepTest2
          --add-data "android-helper\assets;android-helper\assets"
          --add-data "src\deeptesting\assets;deeptesting\assets"
          --add-data "platform-tools;platform-tools"
          --paths src launcher.py

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path dist\DeepTest2 -DestinationPath DeepTest2-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepTest2-Windows
          path: DeepTest2-windows.zip
